<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 310" width="100%" height="100%">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#008f11" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1512" />
      <stop offset="100%" stop-color="#080c10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes reticleRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes scanbeam { 0% { transform: translateY(0px); opacity: 0.1; } 50% { opacity: 0.25; } 100% { transform: translateY(310px); opacity: 0.1; } }
      .term-cursor { animation: blink 1s infinite; }
      .radar-spin { transform-origin: 110px 145px; animation: reticleRotate 12s linear infinite; }
      .radar-reverse { transform-origin: 110px 145px; animation: reticleRotate 8s linear infinite reverse; }
      .pulse-pill { animation: pulseGlow 2.5s ease-in-out infinite; }
      .scan-line { animation: scanbeam 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="948" height="308" rx="10" fill="#070b0e" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#00ff41" stroke-width="1">
    <line x1="220" y1="35" x2="220" y2="308" />
    <line x1="1" y1="90" x2="949" y2="90" />
    <line x1="1" y1="150" x2="949" y2="150" />
    <line x1="1" y1="210" x2="949" y2="210" />
    <line x1="1" y1="270" x2="949" y2="270" />
  </g>

  <!-- Scanline Beam -->
  <line x1="1" y1="0" x2="949" y2="0" stroke="#00ff41" stroke-width="2" class="scan-line" />

  <!-- Terminal Window Bar -->
  <path d="M 1 11 C 1 5.5 5.5 1 11 1 L 939 1 C 944.5 1 949 5.5 949 11 L 949 35 L 1 35 Z" fill="url(#headerGrad)" stroke="#00ff4133" stroke-width="1" />
  <circle cx="22" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="40" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="58" cy="18" r="5.5" fill="#27c93f" />

  <!-- Window Header Title -->
  <text x="80" y="22" fill="#8b949e" font-family="monospace, Courier" font-size="12" font-weight="bold">operator@vvce-node: ~/profile/system_dossier.env</text>

  <!-- Status Pill -->
  <g transform="translate(800, 9)">
    <rect x="0" y="0" width="135" height="18" rx="9" fill="#00ff4115" stroke="#00ff4155" stroke-width="1" />
    <circle cx="12" cy="9" r="4" fill="#00ff41" filter="url(#glow)" class="pulse-pill" />
    <text x="24" y="13" fill="#00ff41" font-family="monospace, Courier" font-size="10.5" font-weight="bold" letter-spacing="1">NODE ONLINE</text>
  </g>

  <!-- LEFT: Tactical Cyber Reticle / Node Identity -->
  <g>
    <!-- Outer Reticle Ring -->
    <circle cx="110" cy="145" r="65" fill="none" stroke="#00ff4122" stroke-width="1.5" />
    <!-- Rotating Dashed Ring -->
    <circle cx="110" cy="145" r="56" fill="none" stroke="#00ff4166" stroke-width="1.5" stroke-dasharray="6 8 18 8" class="radar-spin" />
    <!-- Inner Counter-Rotating Ring -->
    <circle cx="110" cy="145" r="44" fill="none" stroke="#00ff4144" stroke-width="1" stroke-dasharray="12 6 4 6" class="radar-reverse" />
    <!-- Center Target Core -->
    <circle cx="110" cy="145" r="26" fill="#00ff4112" stroke="#00ff41" stroke-width="1.5" />
    <!-- Reticle Crosshairs -->
    <line x1="110" y1="75" x2="110" y2="90" stroke="#00ff41" stroke-width="1.5" />
    <line x1="110" y1="200" x2="110" y2="215" stroke="#00ff41" stroke-width="1.5" />
    <line x1="40" y1="145" x2="55" y2="145" stroke="#00ff41" stroke-width="1.5" />
    <line x1="165" y1="145" x2="180" y2="145" stroke="#00ff41" stroke-width="1.5" />
    <!-- Core Text -->
    <text x="110" y="142" fill="#00ff41" font-family="monospace, Courier" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">AIML</text>
    <text x="110" y="155" fill="#ffffff" font-family="monospace, Courier" font-size="9" font-weight="bold" text-anchor="middle" opacity="0.9">VVCE</text>

    <!-- Telemetry Badges Under Reticle -->
    <rect x="35" y="222" width="150" height="17" rx="3" fill="#00000066" stroke="#00ff4133" stroke-width="1" />
    <text x="110" y="234" fill="#8b949e" font-family="monospace, Courier" font-size="9.5" text-anchor="middle">SYS: <tspan fill="#00ff41" font-weight="bold">x86_64 // LINUX</tspan></text>

    <rect x="35" y="244" width="150" height="17" rx="3" fill="#00000066" stroke="#00ff4133" stroke-width="1" />
    <text x="110" y="256" fill="#8b949e" font-family="monospace, Courier" font-size="9.5" text-anchor="middle">GPS: <tspan fill="#38ef7d">12.3051° N, 76.6551° E</tspan></text>

    <rect x="35" y="266" width="150" height="17" rx="3" fill="#00000066" stroke="#00ff4133" stroke-width="1" />
    <text x="110" y="278" fill="#8b949e" font-family="monospace, Courier" font-size="9.5" text-anchor="middle">LATENCY: <tspan fill="#00ff41" font-weight="bold">&lt; 5 ms [CACHED]</tspan></text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="215" y1="45" x2="215" y2="295" stroke="#00ff4133" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- RIGHT: System Dossier Telemetry Table -->
  <g font-family="monospace, Courier" font-size="12.5" transform="translate(235, 62)">
    <!-- Row 1: OPERATOR -->
    <text x="0" y="0" fill="#00ff41" font-weight="bold">OPERATOR    :</text>
    <text x="125" y="0" fill="#ffffff" font-weight="900" letter-spacing="0.5">MADHUKUMAR V</text>
    <text x="270" y="0" fill="#8b949e" font-size="11">// AIML Undergrad &amp; Software Systems Researcher</text>

    <!-- Row 2: ACADEMIA -->
    <text x="0" y="26" fill="#00ff41" font-weight="bold">ACADEMIA    :</text>
    <text x="125" y="26" fill="#38ef7d" font-weight="bold">Vidyavardhaka College of Engineering (VVCE), Mysuru</text>
    <text x="545" y="26" fill="#8b949e" font-size="11">[B.E. AIML]</text>

    <!-- Row 3: MISSION -->
    <text x="0" y="52" fill="#00ff41" font-weight="bold">DIRECTIVES  :</text>
    <text x="125" y="52" fill="#00e5ff">Low-Latency Green AI · Satellite CV · Defensive AppSec · Quant</text>

    <!-- Row 4: TELEMETRY -->
    <text x="0" y="78" fill="#00ff41" font-weight="bold">TELEMETRY   :</text>
    <text x="125" y="78" fill="#ffffff">Zero-Watt Vector Cache (&lt;5ms) • Intel RAPL / NVML Joules Profiling</text>

    <!-- Row 5: SENSORS -->
    <text x="0" y="104" fill="#00ff41" font-weight="bold">PAYLOADS    :</text>
    <text x="125" y="104" fill="#38ef7d">ASTER L1T 8-Band Multispectral Vision • Bidirectional LSTM / ARIMA</text>

    <!-- Row 6: LANGUAGES -->
    <text x="0" y="130" fill="#00ff41" font-weight="bold">LANGUAGES   :</text>
    <text x="125" y="130" fill="#ffffff">English <tspan fill="#8b949e">(Fluent)</tspan> • Kannada <tspan fill="#8b949e">(Native)</tspan> • Hindi • German &amp; Japanese <tspan fill="#00e5ff">(Learning)</tspan></text>

    <!-- Row 7: PHILOSOPHY -->
    <text x="0" y="156" fill="#00ff41" font-weight="bold">DOCTRINE    :</text>
    <text x="125" y="156" fill="#ffd700" font-style="italic">"Zero redundant tokens. Physical Joules matter. Surgical code."</text>

    <!-- Row 8: TERMINAL PROMPT -->
    <g transform="translate(0, 192)">
      <rect x="-5" y="-14" width="685" height="24" rx="4" fill="#00000088" stroke="#00ff4122" stroke-width="1" />
      <text x="5" y="2" fill="#8b949e" font-size="11">madhukumar@vvce-node:~$</text>
      <text x="175" y="2" fill="#00ff41" font-size="11" font-weight="bold">sysctl -w kernel.optimization=SURGICAL_MAX</text>
      <text x="480" y="2" fill="#00ff41" font-size="13" class="term-cursor">█</text>
    </g>
  </g>
</svg>
