<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Satellite AI HUD">
  <title>SATELLITE MULTISPECTRAL AI // PLANETARY RECON</title>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#080c10" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>

    <!-- Globe Atmosphere Radial Glow -->
    <radialGradient id="globe-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#00FF41" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </radialGradient>

    <!-- Scan Beam Gradient -->
    <linearGradient id="scan-cone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#00FF41" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0.02" />
    </linearGradient>

    <!-- Hex Grid Background Pattern -->
    <pattern id="hex-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 24 6.9 L 24 20.7 L 12 27.6 L 0 20.7 L 0 6.9 Z" fill="none" stroke="#00FF41" stroke-width="0.3" stroke-opacity="0.07" />
    </pattern>

    <!-- Laser Beam Pulse -->
    <linearGradient id="laser-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0" />
      <stop offset="50%" stop-color="#eafff1" stop-opacity="1" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes orbit-motion {
      0% { transform: rotate(0deg) translateX(130px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(130px) rotate(-360deg); }
    }
    @keyframes scan-sweep {
      0% { transform: translateY(0); opacity: 0.8; }
      50% { opacity: 0.2; }
      100% { transform: translateY(140px); opacity: 0.8; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; will-change: opacity; }
    .reticle-cw {
      transform-origin: 750px 140px;
      animation: spin-cw 12s linear infinite;
      will-change: transform;
    }
    .reticle-ccw {
      transform-origin: 750px 140px;
      animation: spin-ccw 8s linear infinite;
      will-change: transform;
    }
    .cursor { animation: blink 0.9s infinite; will-change: opacity; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Container Box -->
  <rect x="0.5" y="0.5" width="899" height="279" rx="8" fill="url(#hud-bg)" stroke="#00FF41" stroke-width="1"/>
  <rect x="1" y="1" width="898" height="278" rx="7" fill="url(#hex-grid)" />

  <!-- Cyber Tech Corners -->
  <path d="M 12 2 L 2 2 L 2 12" fill="none" stroke="#00FF41" stroke-width="2.5" />
  <path d="M 888 2 L 898 2 L 898 12" fill="none" stroke="#00FF41" stroke-width="2.5" />
  <path d="M 2 268 L 2 278 L 12 278" fill="none" stroke="#00FF41" stroke-width="2.5" />
  <path d="M 898 268 L 898 278 L 888 278" fill="none" stroke="#00FF41" stroke-width="2.5" />

  <!-- Top HUD Bar -->
  <rect x="0.5" y="0.5" width="899" height="28" rx="7" fill="#161b22" />
  <line x1="0" y1="28.5" x2="900" y2="28.5" stroke="#00FF41" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Window Dots -->
  <circle cx="18" cy="14.5" r="4" fill="#ff5f56"/>
  <circle cx="32" cy="14.5" r="4" fill="#ffbd2e"/>
  <circle cx="46" cy="14.5" r="4" fill="#27c93f"/>

  <!-- Title Banner -->
  <text x="450" y="18.5" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="700" class="mono">PLANETARY SATELLITE CV // MULTISPECTRAL RECON &amp; TELEMETRY</text>

  <!-- Live Uplink Badge -->
  <circle cx="854" cy="14.5" r="3.5" fill="#00FF41" class="pulse-dot"/>
  <text x="864" y="18" fill="#00FF41" font-size="9" font-weight="700" class="mono">ORBIT</text>

  <!-- ==================== LEFT HUD PANEL: SATELLITE SPECS ==================== -->
  <g transform="translate(30, 52)">
    <rect x="-8" y="0" width="235" height="205" rx="4" fill="#0d1117" fill-opacity="0.7" stroke="#21262d" stroke-width="1"/>
    
    <!-- Header -->
    <path d="M 0 0 L 140 0" stroke="#00FF41" stroke-width="1.5" />
    <text x="0" y="18" fill="#00FF41" font-size="11" font-weight="700" class="mono">🛰️ AQUA-INTEL PAYLOAD</text>
    <text x="0" y="32" fill="#8b949e" font-size="9" class="mono">ORBITAL PLATFORM v2.4</text>

    <!-- Telemetry Lines -->
    <text x="0" y="58" fill="#8b949e" font-size="10" class="mono">SENSOR    :</text>
    <text x="75" y="58" fill="#58a6ff" font-size="10" font-weight="600" class="mono">ASTER L1T 8-BAND</text>

    <text x="0" y="80" fill="#8b949e" font-size="10" class="mono">SPECTRUM  :</text>
    <text x="75" y="80" fill="#a371f7" font-size="10" font-weight="600" class="mono">VNIR + SWIR + TIR</text>

    <text x="0" y="102" fill="#8b949e" font-size="10" class="mono">GROUND RES:</text>
    <text x="75" y="102" fill="#39d353" font-size="10" font-weight="600" class="mono">15m / PIXEL</text>

    <text x="0" y="124" fill="#8b949e" font-size="10" class="mono">COORDS    :</text>
    <text x="75" y="124" fill="#00FF41" font-size="10" font-weight="700" class="mono">12.3051&#176;N, 76.6551&#176;E</text>

    <text x="0" y="146" fill="#8b949e" font-size="10" class="mono">ENGINE    :</text>
    <text x="75" y="146" fill="#58a6ff" font-size="10" font-weight="600" class="mono">GEE API &#8226; FASTAPI</text>

    <line x1="0" y1="160" x2="218" y2="160" stroke="#21262d" stroke-width="1" />

    <text x="0" y="180" fill="#e6edf3" font-size="9.5" font-style="italic" class="mono">&quot;Autonomous marine plastic &amp; algal bloom detection.&quot;</text>
  </g>

  <!-- ==================== CENTER: 3D HOLOGRAPHIC ROTATING GLOBE ==================== -->
  <g transform="translate(450, 150)">
    <!-- Globe Atmosphere Halo -->
    <circle cx="0" cy="0" r="88" fill="url(#globe-halo)" />
    
    <!-- Outer Globe Sphere Rim -->
    <circle cx="0" cy="0" r="76" fill="#050a08" stroke="#00FF41" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- Latitude Ellipses -->
    <ellipse cx="0" cy="0" rx="76" ry="18" fill="none" stroke="#00FF41" stroke-width="0.6" stroke-opacity="0.35"/>
    <ellipse cx="0" cy="-35" rx="67" ry="14" fill="none" stroke="#00FF41" stroke-width="0.5" stroke-opacity="0.25"/>
    <ellipse cx="0" cy="35" rx="67" ry="14" fill="none" stroke="#00FF41" stroke-width="0.5" stroke-opacity="0.25"/>
    <ellipse cx="0" cy="-56" rx="51" ry="10" fill="none" stroke="#00FF41" stroke-width="0.4" stroke-opacity="0.2"/>
    <ellipse cx="0" cy="56" rx="51" ry="10" fill="none" stroke="#00FF41" stroke-width="0.4" stroke-opacity="0.2"/>

    <!-- Longitude Ellipses -->
    <ellipse cx="0" cy="0" rx="28" ry="76" fill="none" stroke="#00FF41" stroke-width="0.5" stroke-opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="54" ry="76" fill="none" stroke="#00FF41" stroke-width="0.5" stroke-opacity="0.25"/>
    <line x1="0" y1="-76" x2="0" y2="76" stroke="#00FF41" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="-76" y1="0" x2="76" y2="0" stroke="#00FF41" stroke-width="0.8" stroke-opacity="0.4"/>

    <!-- Scanning Radar Arc across Globe -->
    <path d="M -70 15 Q 0 -35 70 15" fill="none" stroke="#00FF41" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

    <!-- Target Coordinates Marker on Globe -->
    <circle cx="22" cy="-14" r="3.5" fill="#00FF41" class="pulse-dot"/>
    <circle cx="22" cy="-14" r="8" fill="none" stroke="#00FF41" stroke-width="0.8" opacity="0.6"/>
    <text x="32" y="-12" fill="#00FF41" font-size="9" font-weight="700" class="mono">TARGET [VVCE]</text>

    <!-- Tilted Elliptical Satellite Orbit Line -->
    <g transform="rotate(-22)">
      <ellipse cx="0" cy="0" rx="122" ry="42" fill="none" stroke="#388bfd" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 6"/>
      
      <!-- Satellite Craft Orbiting -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
        
        <!-- Satellite Position at rx=122 -->
        <g transform="translate(122, 0)">
          <!-- Scan Cone from satellite toward earth center -->
          <polygon points="0,0 -80,25 -80,-25" fill="url(#scan-cone)" transform="rotate(180)" />
          
          <!-- Satellite Body -->
          <rect x="-6" y="-4" width="12" height="8" rx="1.5" fill="#eafff1" stroke="#00FF41" stroke-width="0.8"/>
          <!-- Solar Panels -->
          <rect x="-18" y="-3" width="10" height="6" fill="#0077b5" stroke="#388bfd" stroke-width="0.5"/>
          <rect x="8" y="-3" width="10" height="6" fill="#0077b5" stroke="#388bfd" stroke-width="0.5"/>
          <!-- Thruster Glow -->
          <circle cx="0" cy="0" r="2.5" fill="#00FF41" class="pulse-dot"/>
        </g>
      </g>
    </g>

    <text x="0" y="104" text-anchor="middle" fill="#8b949e" font-size="9" class="mono">ASTER L1T ORBITAL SWEEP // SATELLITE AI LOCK</text>
  </g>

  <!-- ==================== RIGHT HUD PANEL: TARGET RETICLE & TELEMETRY ==================== -->
  <g transform="translate(680, 52)">
    <rect x="-12" y="0" width="202" height="205" rx="4" fill="#0d1117" fill-opacity="0.7" stroke="#21262d" stroke-width="1"/>
    
    <!-- Rotating Cyber Reticle -->
    <g transform="translate(85, 75)">
      <!-- Outer Tick Ring (Spinning CW) -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#00FF41" stroke-width="1" stroke-dasharray="4 8" opacity="0.5" class="reticle-cw"/>
      
      <!-- Inner Ring (Spinning CCW) -->
      <circle cx="0" cy="0" r="36" fill="none" stroke="#388bfd" stroke-width="1.2" stroke-dasharray="12 6" opacity="0.6" class="reticle-ccw"/>

      <!-- Center Crosshairs -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#00FF41" stroke-width="0.8" opacity="0.4"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#00FF41" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#00FF41" stroke-width="0.8" opacity="0.5"/>

      <!-- Center Lock Core -->
      <circle cx="0" cy="0" r="4" fill="#00FF41" class="pulse-dot"/>
      <polygon points="0,-12 4,-8 -4,-8" fill="#00FF41"/>
    </g>

    <!-- Target Readouts Below Reticle -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" fill="#00FF41" font-size="10" font-weight="700" class="mono">LOCK: 99.8% CERTAINTY</text>
      <text x="0" y="16" fill="#8b949e" font-size="9" class="mono">ANOMALY: MARINE PLASTIC</text>
      <text x="0" y="32" fill="#58a6ff" font-size="9" class="mono">SPECTRAL RATIO: NIR/SWIR OK</text>
      <text x="0" y="48" fill="#39d353" font-size="9" class="mono">INFERENCE LAG: &lt; 4.8 ms</text>
      <rect x="135" y="38" width="5" height="10" fill="#00FF41" class="cursor"/>
    </g>
  </g>
</svg>