<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8">
  <defs>
    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0" />
      <stop offset="25%" stop-color="#00FF41" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00FF41" stop-opacity="1" />
      <stop offset="75%" stop-color="#00FF41" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="3" width="900" height="1" fill="#1b2d20" opacity="0.4" />
  <rect x="-250" y="2" width="250" height="4" rx="2" fill="url(#laserGlow)" filter="url(#glow)">
    <animate attributeName="x" from="-250" to="900" dur="2.8s" repeatCount="indefinite" />
  </rect>
</svg>
