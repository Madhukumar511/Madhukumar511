<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8">
  <defs>
    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0" />
      <stop offset="35%" stop-color="#00FF41" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#eafff1" stop-opacity="1" />
      <stop offset="65%" stop-color="#00FF41" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .track { fill: #00ff41; opacity: 0.15; }
    .beam {
      will-change: transform;
      animation: laserSweep 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes laserSweep {
      0% { transform: translateX(-300px); }
      50% { transform: translateX(350px); }
      100% { transform: translateX(950px); }
    }
  </style>
  <rect x="0" y="3.5" width="900" height="1" class="track" />
  <rect x="0" y="2" width="300" height="4" rx="2" fill="url(#laserGlow)" class="beam" />
</svg>
