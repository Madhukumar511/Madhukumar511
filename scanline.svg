<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8">
  <defs>
    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0" />
      <stop offset="35%" stop-color="#00FF41" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#eafff1" stop-opacity="1" />
      <stop offset="65%" stop-color="#00FF41" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </linearGradient>
    <filter id="laserBlur" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .track { fill: #00ff41; opacity: 0.12; }
    .beam { will-change: transform; }
  </style>
  <rect x="0" y="3.5" width="900" height="1" class="track" />
  <g class="beam" filter="url(#laserBlur)">
    <rect x="-300" y="2" width="300" height="4" rx="2" fill="url(#laserGlow)">
      <animate attributeName="x" dur="2.4s" repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;0.5;1"
        values="-300;300;950"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
    </rect>
  </g>
</svg>
