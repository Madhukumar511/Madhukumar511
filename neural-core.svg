<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Neural Core Processor">
  <title>ZEROTRACE NEURAL INFERENCE ENGINE</title>
  <defs>
    <linearGradient id="core-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#080c10" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>

    <linearGradient id="chip-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242c" />
      <stop offset="50%" stop-color="#14181f" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <radialGradient id="die-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#00FF41" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bus-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0" />
      <stop offset="50%" stop-color="#eafff1" stop-opacity="1" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </linearGradient>

    <pattern id="pcb-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#00FF41" opacity="0.15" />
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00FF41" stroke-width="0.3" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    @keyframes core-breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes bus-flow-left {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes bus-flow-right {
      0% { stroke-dashoffset: -160; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ring-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .core-pulse {
      transform-origin: 450px 145px;
      animation: core-breathe 3s ease-in-out infinite;
      will-change: transform, opacity;
    }
    .pulse-dot { animation: pulse-fast 1.8s infinite ease-in-out; will-change: opacity; }
    .trace-flow-l {
      stroke-dasharray: 12 40;
      animation: bus-flow-left 2s linear infinite;
      will-change: stroke-dashoffset;
    }
    .trace-flow-r {
      stroke-dasharray: 12 40;
      animation: bus-flow-right 2s linear infinite;
      will-change: stroke-dashoffset;
    }
    .ring-rotate {
      transform-origin: 450px 145px;
      animation: ring-spin 16s linear infinite;
      will-change: transform;
    }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Container Box -->
  <rect x="0.5" y="0.5" width="899" height="279" rx="8" fill="url(#core-bg)" stroke="#00FF41" stroke-width="1"/>
  <rect x="1" y="1" width="898" height="278" rx="7" fill="url(#pcb-grid)" />

  <!-- Cyber Corners -->
  <path d="M 12 2 L 2 2 L 2 12" fill="none" stroke="#00FF41" stroke-width="2.5" />
  <path d="M 888 2 L 898 2 L 898 12" fill="none" stroke="#00FF41" stroke-width="2.5" />
  <path d="M 2 268 L 2 278 L 12 278" fill="none" stroke="#00FF41" stroke-width="2.5" />
  <path d="M 898 268 L 898 278 L 888 278" fill="none" stroke="#00FF41" stroke-width="2.5" />

  <!-- Top Bar -->
  <rect x="0.5" y="0.5" width="899" height="28" rx="7" fill="#161b22" />
  <line x1="0" y1="28.5" x2="900" y2="28.5" stroke="#00FF41" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Controls -->
  <circle cx="18" cy="14.5" r="4" fill="#ff5f56"/>
  <circle cx="32" cy="14.5" r="4" fill="#ffbd2e"/>
  <circle cx="46" cy="14.5" r="4" fill="#27c93f"/>

  <text x="450" y="18.5" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="700" class="mono">ZEROTRACE AI // SUB-5MS SEMANTIC VECTOR INFERENCE CORE</text>

  <circle cx="854" cy="14.5" r="3.5" fill="#00FF41" class="pulse-dot"/>
  <text x="864" y="18" fill="#00FF41" font-size="9" font-weight="700" class="mono">LIVE</text>

  <!-- ==================== LEFT: RAPL/NVML PHYSICAL ENERGY TELEMETRY ==================== -->
  <g transform="translate(30, 52)">
    <rect x="-8" y="0" width="225" height="205" rx="4" fill="#0d1117" fill-opacity="0.75" stroke="#21262d" stroke-width="1"/>
    
    <path d="M 0 0 L 120 0" stroke="#00FF41" stroke-width="1.5" />
    <text x="0" y="18" fill="#00FF41" font-size="11" font-weight="700" class="mono">⚡ HARDWARE ENERGY HUD</text>
    <text x="0" y="32" fill="#8b949e" font-size="9" class="mono">RAPL &amp; NVML TELEMETRY</text>

    <text x="0" y="58" fill="#8b949e" font-size="10" class="mono">CACHE HIT :</text>
    <text x="75" y="58" fill="#00FF41" font-size="10" font-weight="700" class="mono">&lt; 2.8 ms [0 WATT]</text>

    <text x="0" y="80" fill="#8b949e" font-size="10" class="mono">HIT RATIO :</text>
    <text x="75" y="80" fill="#388bfd" font-size="10" font-weight="600" class="mono">78.4% VECTOR HIT</text>

    <text x="0" y="102" fill="#8b949e" font-size="10" class="mono">ENERGY SAV:</text>
    <text x="75" y="102" fill="#39d353" font-size="10" font-weight="600" class="mono">~64.8% JOULES CUT</text>

    <text x="0" y="124" fill="#8b949e" font-size="10" class="mono">EMBED DIM :</text>
    <text x="75" y="124" fill="#a371f7" font-size="10" font-weight="600" class="mono">384-D ALL-MINILM</text>

    <text x="0" y="146" fill="#8b949e" font-size="10" class="mono">BACKEND   :</text>
    <text x="75" y="146" fill="#58a6ff" font-size="10" font-weight="600" class="mono">FASTAPI &#8226; OLLAMA</text>

    <line x1="0" y1="160" x2="208" y2="160" stroke="#21262d" stroke-width="1" />
    <text x="0" y="180" fill="#e6edf3" font-size="9.5" font-style="italic" class="mono">&quot;Zero redundant tokens. Real physical Joules matter.&quot;</text>
  </g>

  <!-- ==================== CENTER: 3D QUANTUM NEURAL CHIP DIE ==================== -->
  <g transform="translate(450, 145)">
    <!-- Circuit Bus Lines Ingestion (Left to Center) -->
    <path d="M -190 -45 L -100 -45 L -70 -20 L -45 -20" fill="none" stroke="#00FF41" stroke-width="1.2" opacity="0.4"/>
    <path d="M -190 -45 L -100 -45 L -70 -20 L -45 -20" fill="none" stroke="#eafff1" stroke-width="2" class="trace-flow-l"/>

    <path d="M -190 0 L -60 0" fill="none" stroke="#00FF41" stroke-width="1.2" opacity="0.4"/>
    <path d="M -190 0 L -60 0" fill="none" stroke="#eafff1" stroke-width="2" class="trace-flow-l"/>

    <path d="M -190 45 L -100 45 L -70 20 L -45 20" fill="none" stroke="#00FF41" stroke-width="1.2" opacity="0.4"/>
    <path d="M -190 45 L -100 45 L -70 20 L -45 20" fill="none" stroke="#eafff1" stroke-width="2" class="trace-flow-l"/>

    <!-- Circuit Bus Lines Egress (Center to Right) -->
    <path d="M 45 -20 L 70 -20 L 100 -45 L 190 -45" fill="none" stroke="#00FF41" stroke-width="1.2" opacity="0.4"/>
    <path d="M 45 -20 L 70 -20 L 100 -45 L 190 -45" fill="none" stroke="#388bfd" stroke-width="2" class="trace-flow-r"/>

    <path d="M 60 0 L 190 0" fill="none" stroke="#00FF41" stroke-width="1.2" opacity="0.4"/>
    <path d="M 60 0 L 190 0" fill="none" stroke="#388bfd" stroke-width="2" class="trace-flow-r"/>

    <path d="M 45 20 L 70 20 L 100 45 L 190 45" fill="none" stroke="#00FF41" stroke-width="1.2" opacity="0.4"/>
    <path d="M 45 20 L 70 20 L 100 45 L 190 45" fill="none" stroke="#388bfd" stroke-width="2" class="trace-flow-r"/>

    <!-- Outer Rotating Accelerator Ring -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#00FF41" stroke-width="1" stroke-dasharray="6 10" opacity="0.45" class="ring-rotate"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#388bfd" stroke-width="0.8" stroke-dasharray="14 8" opacity="0.35" class="ring-rotate" style="animation-duration:24s;"/>

    <!-- Processor Substrate Carrier -->
    <rect x="-56" y="-56" width="112" height="112" rx="8" fill="url(#chip-metal)" stroke="#00FF41" stroke-width="1.2"/>
    
    <!-- Gold/Copper Ball Grid Corner Pins -->
    <circle cx="-46" cy="-46" r="2.5" fill="#c9a24a"/>
    <circle cx="46" cy="-46" r="2.5" fill="#c9a24a"/>
    <circle cx="-46" cy="46" r="2.5" fill="#c9a24a"/>
    <circle cx="46" cy="46" r="2.5" fill="#c9a24a"/>

    <!-- Silicon Die (Pulsing Glow) -->
    <rect x="-38" y="-38" width="76" height="76" rx="4" fill="#040608" stroke="#00FF41" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="34" fill="url(#die-glow)" class="core-pulse"/>

    <!-- Internal Core Label -->
    <text x="0" y="-10" text-anchor="middle" fill="#00FF41" font-size="10" font-weight="800" class="mono">ZEROTRACE</text>
    <text x="0" y="4" text-anchor="middle" fill="#8b949e" font-size="8" class="mono">384-D ENGINE</text>
    <text x="0" y="16" text-anchor="middle" fill="#39d353" font-size="8" font-weight="700" class="mono">&lt; 5ms // 0W</text>

    <!-- Subtitle -->
    <text x="0" y="104" text-anchor="middle" fill="#8b949e" font-size="9" class="mono">NEURAL PIPELINE // SYNAPSE BUS ACCELERATION</text>
  </g>

  <!-- ==================== RIGHT: QUANT & LATENCY MONITOR ==================== -->
  <g transform="translate(680, 52)">
    <rect x="-12" y="0" width="202" height="205" rx="4" fill="#0d1117" fill-opacity="0.75" stroke="#21262d" stroke-width="1"/>
    
    <path d="M 0 0 L 120 0" stroke="#00FF41" stroke-width="1.5" />
    <text x="0" y="18" fill="#00FF41" font-size="11" font-weight="700" class="mono">📈 LATENCY &amp; ALPHA HUD</text>
    <text x="0" y="32" fill="#8b949e" font-size="9" class="mono">MARKETXPERT QUANT STREAM</text>

    <!-- Oscilloscope Frequency Waveform -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="180" height="42" rx="3" fill="#050a08" stroke="#00FF41" stroke-width="0.6" stroke-opacity="0.3"/>
      <!-- Grid -->
      <line x1="0" y1="21" x2="180" y2="21" stroke="#00FF41" stroke-width="0.4" stroke-opacity="0.2"/>
      <line x1="45" y1="0" x2="45" y2="42" stroke="#00FF41" stroke-width="0.4" stroke-opacity="0.15"/>
      <line x1="90" y1="0" x2="90" y2="42" stroke="#00FF41" stroke-width="0.4" stroke-opacity="0.15"/>
      <line x1="135" y1="0" x2="135" y2="42" stroke="#00FF41" stroke-width="0.4" stroke-opacity="0.15"/>
      <!-- Oscilloscope Wave Path -->
      <path d="M 0 21 Q 20 5 40 21 T 80 21 T 120 5 T 150 35 T 180 21" fill="none" stroke="#00FF41" stroke-width="1.5"/>
      <circle cx="180" cy="21" r="2.5" fill="#00FF41" class="pulse-dot"/>
    </g>

    <g transform="translate(0, 114)">
      <text x="0" y="0" fill="#00FF41" font-size="10" font-weight="700" class="mono">STATUS   : ACTIVE REAL-TIME</text>
      <text x="0" y="18" fill="#58a6ff" font-size="9.5" class="mono">QUANT    : LSTM + MOMENTUM</text>
      <text x="0" y="34" fill="#a371f7" font-size="9.5" class="mono">TELEMETRY: RAPL ENERGY PROFILING</text>
      <text x="0" y="50" fill="#39d353" font-size="9.5" class="mono">STATE    : 0 PACKET LOSS</text>
      <rect x="125" y="40" width="5" height="10" fill="#00FF41" class="pulse-dot"/>
    </g>
  </g>
</svg>