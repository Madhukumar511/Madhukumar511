name: Purge Profile Camo Cache

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge GitHub Camo Cache
        run: |
          python3 -c "
          import urllib.request, re, subprocess
          try:
              req = urllib.request.Request('https://github.com/Madhukumar511', headers={'User-Agent': 'Mozilla/5.0'})
              html = urllib.request.urlopen(req, timeout=15).read().decode('utf-8')
              camo_urls = set(re.findall(r'https://camo\.githubusercontent\.com/[a-f0-9]+/[a-f0-9]+', html))
              print(f'Found {len(camo_urls)} Camo cached URLs to purge.')
              for u in camo_urls:
                  subprocess.run(['curl', '-s', '-X', 'PURGE', u], timeout=5)
              print('Camo cache successfully purged for all profile assets.')
          except Exception as e:
              print('Notice: Camo purge error:', e)
          "
